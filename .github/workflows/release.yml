name: Build & Release

# Triggers:
#   • Push a tag like "v1.0.0"      → build + create GitHub Release with EXEs attached.
#   • workflow_dispatch (manual run) → build + create GitHub Release using the given version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    name: Build Windows EXEs
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # The Luau submodule gitlink was never committed to the repo, so
      # submodules: recursive is a no-op.  Clone it directly instead.
      - name: Clone Luau into extern/luau
        run: git clone --depth=1 https://github.com/luau-lang/luau.git extern/luau

      # ── C++ DLL (xcutor.dll) ──────────────────────────────────────────────
      - name: Configure CMake (DLL)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build xcutor.dll
        run: cmake --build build --config Release

      # ── C++ injector (xcutor-inject.exe) ──────────────────────────────────
      - name: Configure CMake (injector)
        working-directory: injector
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build xcutor-inject.exe
        working-directory: injector
        run: cmake --build build --config Release

      - name: Verify injector EXE
        run: Test-Path injector\build\Release\xcutor-inject.exe | Should -Be $true
        shell: pwsh
        continue-on-error: true   # non-fatal: let artifact upload tell us if it's missing

      # ── WPF UI (Executor.exe) ─────────────────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Executor.exe (self-contained single file)
        run: |
          dotnet publish ui/Executor.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output dist
        shell: pwsh

      # ── Upload as build artifacts (always) ───────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcutor-windows-x64
          retention-days: 30
          path: |
            build/Release/xcutor.dll
            injector/build/Release/xcutor-inject.exe
            dist/Executor.exe

      # ── Create GitHub Release (tag pushes and manual runs) ───────────────
      - name: Resolve release version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Executor ${{ steps.ver.outputs.tag }}"
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: false
          files: |
            build/Release/xcutor.dll
            injector/build/Release/xcutor-inject.exe
            dist/Executor.exe
